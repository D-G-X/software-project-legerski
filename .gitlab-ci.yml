stages:
  - build
  - test
  - security

# ==================== BUILD STAGE ====================

build-frontend:
  stage: build
  image: node:20.19.1
  script:
    - cd license-application-service
    - npm install
    - npm run build
  artifacts:
    paths:
      - license-application-service/src/main/webapp/
    expire_in: 1 hour

build-backend:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  services:
    - postgres:15
  variables:
    POSTGRES_DB: licensing_db
    POSTGRES_USER: licensing_user
    POSTGRES_PASSWORD: licensing_pass
    POSTGRES_HOST_AUTH_METHOD: trust
  script:
    - cd license-application-service
    - chmod +x mvnw
    # Install PostgreSQL client to test connection
    - apt-get update -qq && apt-get install -y -qq postgresql-client
    # Wait for PostgreSQL to be ready (increased timeout)
    - |
      echo "Waiting for PostgreSQL to be ready..."
      for i in {1..30}; do
        if PGPASSWORD=$POSTGRES_PASSWORD psql -h postgres -U $POSTGRES_USER -d $POSTGRES_DB -c '\q' 2>/dev/null; then
          echo "PostgreSQL is ready!"
          break
        fi
        echo "Attempt $i/30: PostgreSQL not ready yet, waiting..."
        sleep 2
      done
    # Extra wait to ensure database is stable
    - sleep 3
    # Build with Maven
    - ./mvnw clean package -DskipTests
  artifacts:
    paths:
      - license-application-service/target/*.jar
    expire_in: 1 hour
  dependencies:
    - build-frontend

# ==================== TEST STAGE ====================

test-frontend:
  stage: test
  image: node:20.19.1
  script:
    - cd license-application-service
    - npm install
    - npm test
  dependencies:
    - build-frontend

test-backend:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  services:
    - postgres:15
  variables:
    POSTGRES_DB: test_licensing_db
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_pass
    POSTGRES_HOST_AUTH_METHOD: trust
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/test_licensing_db
    SPRING_DATASOURCE_USERNAME: test_user
    SPRING_DATASOURCE_PASSWORD: test_pass
  script:
    - cd license-application-service
    - chmod +x mvnw
    - ./mvnw test
  dependencies:
    - build-backend

# ==================== SECURITY STAGE ====================

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml

variables:
  SECRET_DETECTION_ENABLED: "true"
  SAST_EXCLUDED_PATHS: "node_modules/,target/,__mocks__/,.mvn/"
