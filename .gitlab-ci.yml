stages:
  - build
  - test
  - security

variables:
  # PostgreSQL configuration for CI/CD
  POSTGRES_DB: licensing_db
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres_ci_password
  POSTGRES_HOST_AUTH_METHOD: trust

# Build Frontend (inside backend project)
build-frontend:
  stage: build
  image: node:20.19.1
  before_script:
    - cd license-application-service
    - npm install
  script:
    - npm run build
  artifacts:
    paths:
      - license-application-service/src/main/resources/static/
    expire_in: 1 hour
  only:
    - main
    - merge_requests

# Test Frontend
test-frontend:
  stage: test
  image: node:20.19.1
  before_script:
    - cd license-application-service
    - npm install
  script:
    - npm test
  only:
    - main
    - merge_requests

# Build Backend (with PostgreSQL for jOOQ)
build-backend:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  services:
    - name: postgres:15
      alias: postgres
  variables:
    POSTGRES_DB: licensing_db
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres_ci_password
  before_script:
    - cd license-application-service
    # Wait for PostgreSQL to be ready
    - apt-get update && apt-get install -y postgresql-client
    - |
      echo "Waiting for PostgreSQL to be ready..."
      until PGPASSWORD=$POSTGRES_PASSWORD psql -h postgres -U $POSTGRES_USER -d $POSTGRES_DB -c '\q'; do
        echo "PostgreSQL is unavailable - sleeping"
        sleep 2
      done
      echo "PostgreSQL is up and running!"
    # Create the licensing schema
    - |
      PGPASSWORD=$POSTGRES_PASSWORD psql -h postgres -U $POSTGRES_USER -d $POSTGRES_DB -c "CREATE SCHEMA IF NOT EXISTS licensing;"
      echo "Schema 'licensing' created successfully"
  script:
    # Build with jOOQ code generation using CI database configuration
    - ./mvnw clean package -DskipTests 
      -Djooq.jdbc.url=jdbc:postgresql://postgres:5432/licensing_db
      -Djooq.jdbc.user=postgres
      -Djooq.jdbc.password=postgres_ci_password
  artifacts:
    paths:
      - license-application-service/target/*.jar
    expire_in: 1 hour
  dependencies:
    - build-frontend
  only:
    - main
    - merge_requests

# Test Backend
test-backend:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  services:
    - name: postgres:15
      alias: postgres
  variables:
    POSTGRES_DB: licensing_db
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres_ci_password
  before_script:
    - cd license-application-service
    # Wait for PostgreSQL
    - apt-get update && apt-get install -y postgresql-client
    - |
      until PGPASSWORD=$POSTGRES_PASSWORD psql -h postgres -U $POSTGRES_USER -d $POSTGRES_DB -c '\q'; do
        sleep 2
      done
    # Create schema for tests
    - PGPASSWORD=$POSTGRES_PASSWORD psql -h postgres -U $POSTGRES_USER -d $POSTGRES_DB -c "CREATE SCHEMA IF NOT EXISTS licensing;"
  script:
    - ./mvnw test
      -Djooq.jdbc.url=jdbc:postgresql://postgres:5432/licensing_db
      -Djooq.jdbc.user=postgres
      -Djooq.jdbc.password=postgres_ci_password
  dependencies:
    - build-backend
  only:
    - main
    - merge_requests

# Security: SAST (Static Application Security Testing)
sast:
  stage: security
  allow_failure: true
  only:
    - main
    - merge_requests

# Security: Secret Detection
secret_detection:
  stage: security
  allow_failure: true
  only:
    - main
    - merge_requests

# Security: Dependency Scanning
dependency_scanning:
  stage: security
  allow_failure: true
  only:
    - main
    - merge_requests

# Include GitLab security templates
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
