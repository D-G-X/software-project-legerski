# CI/CD Pipeline for Mallorca Holiday Rental Licensing Portal 
# This pipeline builds and tests both the React frontend and Spring Boot backend
# in a monorepo structure.

stages:
  - build
  - test
  - security

# FRONTEND BUILD & TEST

build-frontend:
  stage: build
  image: node:20.19.1
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - cd license-application-service
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run build
  artifacts:
    paths:
      - license-application-service/target/classes/static/
    expire_in: 1 hour
  cache:
    key: "${CI_COMMIT_REF_SLUG}-frontend"
    paths:
      - license-application-service/.npm/
      - license-application-service/node_modules/

test-frontend:
  stage: test
  image: node:20.19.1
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - cd license-application-service
    - npm ci --cache .npm --prefer-offline
  script:
    - npm test
  cache:
    key: "${CI_COMMIT_REF_SLUG}-frontend"
    paths:
      - license-application-service/.npm/
      - license-application-service/node_modules/

# BACKEND BUILD & TEST (with jOOQ skipped)

build-backend:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  needs:
    - job: build-frontend
      artifacts: true
  before_script:
    - cd license-application-service
  script:
    # Skip jOOQ code generation during CI/CD build
    - ./mvnw clean package -DskipTests -Djooq.codegen.skip=true
  artifacts:
    paths:
      - license-application-service/target/*.jar
    expire_in: 1 hour
  cache:
    key: "${CI_COMMIT_REF_SLUG}-backend"
    paths:
      - license-application-service/.m2/repository

test-backend:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  services:
    - postgres:15
  variables:
    POSTGRES_DB: rental_license_db
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/rental_license_db
    SPRING_DATASOURCE_USERNAME: postgres
    SPRING_DATASOURCE_PASSWORD: postgres
  before_script:
    - cd license-application-service
  script:
    - ./mvnw test
  cache:
    key: "${CI_COMMIT_REF_SLUG}-backend"
    paths:
      - license-application-service/.m2/repository


# SECURITY SCANNING


include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml

# Only run security scans on main branch or merge requests
sast:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

secret_detection:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

gemnasium-dependency_scanning:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
