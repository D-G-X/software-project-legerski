services:
  postgres:
    image: postgres:18.0
    environment:
    - POSTGRES_DB=government
    - POSTGRES_USER=postgres
    - POSTGRES_PASSWORD=P4ssword!
    ports:
    - "5433:5432"
    volumes:
      - kc_db:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    volumes:
      - ./keycloak/imports:/opt/keycloak/data/imports

volumes:
  kc_db:
