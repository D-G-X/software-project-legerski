# DB CREDENTIALS - DO NOT CHANGE!!!
services:
  postgres:
    image: postgres:18.0
    environment:
      - POSTGRES_DB=government
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=P4ssword!
    ports:
      - "5433:5432"
    volumes:
      - kc_db:/var/lib/postgresql
    networks:
      - app-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    command: start-dev --import-realm --features=scripts
    environment:
      # KEYCLOAK_ADMIN: admin
      # KEYCLOAK_ADMIN_PASSWORD: admin
      KC_FEATURES: scripts
      KC_SCRIPTS_UPLOAD_ENABLED: "true"
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    volumes:
      - ./keycloak-import/realm-export.json:/opt/keycloak/data/import/realm-export.json
    networks:
      - app-network

  mock-bank:
    build:
      context: ../license-application-mock-bank
      dockerfile: Dockerfile
    container_name: mock-bank
    ports:
      - "8082:8080"
    restart: unless-stopped

  mock-document-validator:
    build:
      context: ../license-application-mock-validator
      dockerfile: Dockerfile
    container_name: mock-document-validator
    ports:
      - "8083:8080"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: react-frontend
    ports:
      - "80:80"
    depends_on:
      - nginx
    networks:
      - app-network

  backend:
    image: license-application-service-backend
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/government
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=P4ssword!
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - KEYCLOAK_AUTH_SERVER_URL=http://keycloak:8080
    depends_on:
      - postgres
      - keycloak
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: nginx-load-balancer
    ports:
      - "8090:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  kc_db:

networks:
  app-network:
    driver: bridge