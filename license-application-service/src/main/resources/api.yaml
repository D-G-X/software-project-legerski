openapi: 3.1.0
info:
  title: Mallorca Holiday Rental Licensing API
  version: 1.0.0
  description: |
    API for managing applications, licenses, and payments for the Mallorca Holiday Rental Licensing system.
    Supports GDPR-compliant user management through Keycloak integration and ensures transparent, fair allocation of ETV licenses.

servers:
  - url: https://localhost

tags:
  - name: Users
    description: Operations related to user management including account creation, updates, and authentication.
  - name: Applications
    description: Managing holiday rental license applications, including submission, updates, and retrieval.
  - name: Licenses
    description: Handling issued licenses for holiday rental properties, including retrieval and status management.
  - name: Document Verification
    description: Endpoints for uploading, verifying, and managing application supporting documents.
  - name: Payments
    description: Processing and tracking payments related to license applications and renewals.
  - name: Consent
    description: Managing user consents for data processing and compliance with regulatory requirements.


security:
  - KeycloakOAuth2: [openid, profile, email]

paths:
  /users:
    get:
      tags: [Users]
      summary: List all users
      description: Retrieve a paginated list of users, optionally filtered by username or email, supporting search and pagination parameters.
      operationId: listUsers
      security:
        - KeycloakOAuth2: [openid]
      parameters:
        - name: username
          in: query
          schema:
            type: string
          description: Filter users by username.
          example: johndoe
        - name: email
          in: query
          schema:
            type: string
            format: email
          description: Filter users by email.
          example: johndoe@example.com
        - name: first
          in: query
          schema:
            type: integer
            minimum: 0
          description: Index of the first result to return (pagination offset).
          example: 0
        - name: max
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Maximum number of results to return.
          example: 20
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserRecord"
        "400":
          description: Invalid query parameter
        "401":
          description: Unauthorized

    post:
      summary: Create a new user
      description: Create a new user account with the provided details.
      operationId: createUser
      tags: [Users]
      security:
        - KeycloakOAuth2: [openid]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                schema:
                  $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: User created successfully
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "409":
          description: User already exists

  /users/{userId}:
    get:
      tags: [Users]
      summary: Get user by ID
      description: Retrieve detailed information for a specific user by their unique identifier.
      operationId: getUser
      security:
        - KeycloakOAuth2: [openid]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRecord"

    patch:
      summary: Update user attributes or password
      description:  Update the attributes or password of a specific user.
      operationId: updateUser
      tags: [Users]
      security:
        - KeycloakOAuth2: [openid]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                  format: email
                enabled:
                  type: boolean
                credentials:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        enum: [password]
                      value:
                        type: string
                      temporary:
                        type: boolean
      responses:
        "204":
          description: User updated successfully
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "404":
          description: User not found

    delete:
      tags: [Users]
      summary: Delete a user by ID
      description: Remove a user from the system by their ID.
      operationId: deleteUser
      security:
        - KeycloakOAuth2: [openid]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Unauthorized
        "203":
          description: Forbidden
        "204":
          description: User deleted
        "404":
          description: User not found

  /applications:
    get:
      tags: [Applications]
      summary: List all applications or filter by status
      description: Retrieve all holiday rental license applications or filter them by status and user ID.
      operationId: listApplications
      security:
        - KeycloakOAuth2: [openid]
      parameters:
        - name: user_id
          in: query
          description: Filter licenses by user ID
          required: false
          schema:
            type: string
            format: uuid
        - name: application_status
          in: query
          description: Filter applications by status
          required: false
          schema:
            $ref: "#/components/schemas/ApplicationStatus"
      responses:
        "200":
          description: List of applications (optionally filtered by status)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApplicationRecord"
    post:
      tags: [Applications]
      summary: Create a new application
      description: Submit a new holiday rental license application.
      operationId: createApplication
      security:
        - KeycloakOAuth2: [openid]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationCreate"
      responses:
        "201":
          description: Application created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationRecord"

  /applications/{applicationId}:
    get:
      tags: [Applications]
      summary: Get application by ID
      description: Retrieve details of a specific application using its ID.
      operationId: getApplication
      security:
        - KeycloakOAuth2: [openid]
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Application details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationRecord"
    patch:
      tags: [Applications]
      summary: Update application status or remarks
      description: Modify the status or remarks of an existing application.
      operationId: updateApplication
      security:
        - KeycloakOAuth2: [openid]
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationUpdate"
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationRecord"

    delete:
      tags: [Applications]
      summary: Delete application by ID
      description: >
        Deletes the specified application. Note: Deleting an application that has an associated license
        will also result in deletion of the linked license.
      operationId: deleteApplication
      security:
        - KeycloakOAuth2: [openid]
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Application deleted successfully (and associated license if exists)
        '404':
          description: Application not found
        '403':
          description: Forbidden - insufficient permissions


  /applications/{applicationId}/documents:
    post:
      tags: [Document Verification]
      summary: Upload a document for an application
      description: Upload a supporting document for an application.
      operationId: uploadDocument
      security:
        - KeycloakOAuth2: [openid]
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                document_type:
                  type: string
                  example: "proof_of_ownership"
      responses:
        "201":
          description: Document uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDocumentRecord"

    get:
      tags: [Document Verification]
      summary: List documents for an application
      description: List all uploaded documents belonging to a specific application.
      operationId: listDocuments
      security:
        - KeycloakOAuth2: [openid]
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApplicationDocumentRecord"

  /applications/{applicationId}/documents/{documentId}/verification:
    post:
      tags: [Document Verification]
      summary: Verify or reject a submitted document
      description: Update the verification status of a submitted document, marking it as pending, verified, or rejected.
      operationId: verifyDocument
      security:
        - KeycloakOAuth2: [openid]
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: integer
        - name: documentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                verification_status:
                  type: string
                  enum: [pending, verified, rejected]
                remarks:
                  type: string
      responses:
        "200":
          description: Document verification status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDocumentRecord"

  /applications/{applicationId}/payments:
    get:
      tags: [Payments]
      summary: List payments for an application
      description: Retrieve payment records associated with a specific application.
      operationId: listPayments
      security:
        - KeycloakOAuth2: [openid]
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Payments for the given application
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApplicationPaymentRecord"
    post:
      tags: [Payments]
      summary: Record a payment for an application
      description: Record a new payment related to a holiday rental license application.
      operationId: createPayment
      security:
        - KeycloakOAuth2: [openid]
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationPaymentCreate"
      responses:
        "201":
          description: Payment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationPaymentRecord"

  /applications/{applicationId}/payments/{paymentId}:
    patch:
      tags: [Payments]
      summary: Update payment status for an application payment
      description: Update the status of a specific payment.
      operationId: updatePayment
      security:
        - KeycloakOAuth2: [openid]
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: integer
        - name: paymentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payment_status:
                  $ref: "#/components/schemas/PaymentStatus"
              required:
                - payment_status
      responses:
        "200":
          description: Payment status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationPaymentRecord"

  /applications/lottery:
    post:
      tags: [Applications]
      summary: Run the lottery/ballot on eligible applications
      description: >
        Triggers the allocation (lottery) process, assigning statuses such as 'selected' or 'not_selected'
        to eligible applications for the current lottery round.
      operationId: runLottery
      security:
        - KeycloakOAuth2: [openid]
      requestBody:
        description: Optional parameters for the lottery, such as filtering by license_type or other business criteria
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                license_type:
                  $ref: "#/components/schemas/LicenseType"
      responses:
        "200":
          description: Lottery results with updated application statuses
          content:
            application/json:
              schema:
                type: object
                properties:
                  round_id:
                    type: string
                    description: Unique identifier for the lottery round
                  selected_applications:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApplicationRecord"
                  not_selected_applications:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApplicationRecord"

  /licenses:
    get:
      tags: [Licenses]
      summary: List all licenses or filter by user ID
      description: List all licenses or filter licenses by user ID.
      operationId: listLicenses
      security:
        - KeycloakOAuth2: [openid]
      parameters:
        - name: user_id
          in: query
          description: Filter licenses by user ID
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of licenses (optionally filtered by user ID)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LicenseRecord"

  /licenses/{licenseId}:
    get:
      tags: [Licenses]
      summary: Get license by ID
      description: Get detailed information for a specific license.
      operationId: getLicense
      security:
        - KeycloakOAuth2: [openid]
      parameters:
        - name: licenseId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: License details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseRecord"
    patch:
      tags: [Licenses]
      summary: Update the status of a license
      description: Update the status of a license.
      operationId: updateLicenseStatus
      security:
        - KeycloakOAuth2: [openid]
      parameters:
        - name: licenseId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                license_status:
                  $ref: "#/components/schemas/LicenseStatus"
              required:
                - license_status
      responses:
        "200":
          description: License status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseRecord"

    delete:
      tags: [Licenses]
      summary: Delete license by ID
      description: Delete a license record by its ID.
      operationId: deleteLicense
      security:
        - KeycloakOAuth2: [openid]
      parameters:
        - name: licenseId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: License deleted successfully
        "404":
          description: License not found
        "403":
          description: Forbidden - insufficient permissions

  /consents:
    get:
      tags: [Consent]
      summary: List consents for current user
      description: Retrieve all consents given by the current user.
      operationId: listConsentsForUser
      security:
        - KeycloakOAuth2: [openid]
      responses:
        "200":
          description: Consents for user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConsentRecord"

    post:
      tags: [Consent]
      summary: Give consent for a processing purpose
      description: Grant a new consent for a specific data processing purpose.
      operationId: createConsentForUser
      security:
        - KeycloakOAuth2: [openid]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentCreate"
      responses:
        "201":
          description: Consent granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentRecord"

  /consents/{consentId}:
    delete:
      tags: [Consent]
      summary: Withdraw consent
      description: Withdraw a previously granted consent.
      operationId: deleteConsentForUser
      security:
        - KeycloakOAuth2: [openid]
      parameters:
        - name: consentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Consent withdrawn

  /consents/check:
    post:
      tags: [Consent]
      summary: Check if user has valid consent for purpose
      description: Check whether the user has valid consent for a given purpose.
      operationId: checkConsentForUser
      security:
        - KeycloakOAuth2: [openid]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                purpose:
                  type: string
                  example: "application_processing"
      responses:
        "200":
          description: Consent check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  hasConsent:
                    type: boolean

  /consents/gdpr-deletion:
    post:
      tags: [Consent]
      summary: Request deletion of all personal data under GDPR
      description: >
        Initiates a GDPR data deletion process to erase all personal data related to the user,
        including consents, applications, licenses, and other stored information. This request
        is irreversible and subject to the portal's compliance process.
      operationId: requestGdprDeletion
      security:
        - KeycloakOAuth2: [openid]
      parameters:
        - name: userId
          in: path
          description: Unique identifier of the user whose data should be deleted
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Deletion request accepted and processing started
        '400':
          description: Invalid request
        '401':
          description: Unauthorized


components:
  securitySchemes:
    KeycloakOAuth2:
      type: oauth2
      description: OAuth2 with Keycloak JWT Bearer tokens.
      flows:
        authorizationCode:
          authorizationUrl: https://keycloak.example.com/realms/mallorca/protocol/openid-connect/auth
          tokenUrl: https://keycloak.example.com/realms/mallorca/protocol/openid-connect/token
          scopes:
            openid: OpenID Connect scope
            profile: Profile information access
            email: Email access

  schemas:
    UserRecord:
      type: object
      description: Represents a user of the holiday rental licensing portal, typically sourced from a Keycloak identity provider.
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the user.
          example: f28d1d3b-9bcb-4a74-a65a-2fede2b0a6c3
        username:
          type: string
          description: Unique username for login.
          example: johndoe
        email:
          type: string
          format: email
          description: User's email address.
          example: johndoe@example.com
        firstName:
          type: string
          description: User's first name.
          example: John
        lastName:
          type: string
          description: User's last name.
          example: Doe
        enabled:
          type: boolean
          description: Indicates if account is active.
          example: true
        emailVerified:
          type: boolean
          description: Whether the email has been verified.
          example: true
        createdTimestamp:
          type: integer
          format: int64
          description: Time the user was created (milliseconds since epoch).
          example: 1699458000000
      required:
        - username
        - enabled

    UserCreate:
      type: object
      description: Request payload for creating a new user in Keycloak.
      properties:
        username:
          type: string
          description: Unique username for login.
          example: johndoe
        email:
          type: string
          format: email
          description: User's email address.
          example: johndoe@example.com
        firstName:
          type: string
          description: User's first name.
          example: John
        lastName:
          type: string
          description: User's last name.
          example: Doe
        enabled:
          type: boolean
          description: Indicates if account is active.
          default: true
          example: true
        credentials:
          type: array
          description: List of user credentials.
          items:
            type: object
            properties:
              type:
                type: string
                enum: [password]
                description: Credential type.
                example: password
              temporary:
                type: boolean
                description: Whether this password is temporary.
                default: false
                example: false
              value:
                type: string
                description: Password value (hashed or direct depending on Keycloak configuration).
      required:
        - username
        - enabled

    LicenseRecord:
      type: object
      description: Represents a holiday rental license issued to a user for a property.
      properties:
        id:
          type: integer
          description: Unique license identifier.
          example: 101
        user_id:
          type: string
          format: uuid
          description: User identifier who owns the license.
          example: f28d1d3b-9bcb-4a74-a65a-2fede2b0a6c3
        application_id:
          type: integer
          description: ID of the related application.
          example: 201
        license_type:
          $ref: "#/components/schemas/LicenseType"
        license_status:
          $ref: "#/components/schemas/LicenseStatus"
        issued_at:
          type: string
          format: date-time
          description: Issue date/time of the license.
          example: 2025-07-01T10:00:00Z
        expires_at:
          type: string
          format: date-time
          description: Expiry date/time of the license.
          example: 2028-07-01T10:00:00Z
      required:
        - id
        - user_id
        - application_id
        - license_type
        - license_status

    ApplicationRecord:
      type: object
      description: Represents a user's request for a holiday rental license.
      properties:
        id:
          type: integer
          description: Unique application identifier.
          example: 201
        user_id:
          type: string
          format: uuid
          description: ID of the applicant user.
          example: f28d1d3b-9bcb-4a74-a65a-2fede2b0a6c3
        license_type:
          $ref: "#/components/schemas/LicenseType"
        cadastral_reference:
          type: string
          minLength: 20
          maxLength: 20
          description: Unique cadastral code (property reference).
          example: 1234567AB9999C0001DE
        applied_at:
          type: string
          format: date-time
          description: When the application was submitted.
          example: 2025-05-20T08:00:00Z
        changed_at:
          type: string
          format: date-time
          description: When the application was last updated.
          example: 2025-06-01T10:00:00Z
        application_status:
          $ref: "#/components/schemas/ApplicationStatus"
        remarks:
          type: string
          description: Additional information or comments.
          example: Needs urgent review.
      required:
        - id
        - user_id
        - license_type
        - cadastral_reference
        - application_status

    ApplicationCreate:
      type: object
      description: Payload for creating a new application for a rental license.
      properties:
        user_id:
          type: string
          format: uuid
          description: User who submits the application.
          example: f28d1d3b-9bcb-4a74-a65a-2fede2b0a6c3
        license_type:
          $ref: "#/components/schemas/LicenseType"
        cadastral_reference:
          type: string
          minLength: 20
          maxLength: 20
          description: Property cadastral reference.
          example: 1234567AB9999C0001DE
        remarks:
          type: string
          description: Additional notes.
          example: First time applying
      required:
        - user_id
        - license_type
        - cadastral_reference

    ApplicationUpdate:
      type: object
      description: Used to update the application status or add remarks.
      properties:
        application_status:
          $ref: "#/components/schemas/ApplicationStatus"
        remarks:
          type: string
          description: Additional notes or comments.
          example: Missing one document

    ApplicationPaymentRecord:
      type: object
      description: Represents a payment made for an application.
      properties:
        id:
          type: integer
          description: Unique identifier for the payment.
          example: 401
        application_id:
          type: integer
          description: Associated application ID.
          example: 201
        amount:
          type: number
          format: decimal
          description: Payment amount in EUR.
          example: 123.45
        payment_date:
          type: string
          format: date-time
          description: When payment was made.
          example: 2025-05-22T15:10:00Z
        payment_status:
          $ref: "#/components/schemas/PaymentStatus"
      required:
        - id
        - application_id
        - amount
        - payment_status

    ApplicationPaymentCreate:
      type: object
      description: Payload for creating a new payment for an application.
      properties:
        application_id:
          type: integer
          description: Associated application ID.
          example: 201
        amount:
          type: number
          format: decimal
          description: Amount to be paid in EUR.
          example: 99.99
        payment_status:
          $ref: "#/components/schemas/PaymentStatus"
      required:
        - application_id
        - amount
        - payment_status

    ConsentRecord:
      type: object
      description: Tracks user consent for various data processing purposes.
      properties:
        id:
          type: string
          description: Unique consent record ID.
          example: cr01
        user_id:
          type: string
          description: User who gave (or withdrew) the consent.
          example: f28d1d3b-9bcb-4a74-a65a-2fede2b0a6c3
        purpose:
          type: string
          description: Purpose of the consent (e.g. application processing, marketing).
          example: application_processing
        granted:
          type: boolean
          description: True if consent is currently granted.
          example: true
        granted_at:
          type: string
          format: date-time
          description: When consent was granted.
          example: 2025-05-10T13:00:00Z
        withdrawn_at:
          type: ["null", string]
          format: date-time
          description: When consent was withdrawn, or null if not withdrawn.
          example: null
      required:
        - id
        - user_id
        - purpose
        - granted
        - granted_at

    ConsentCreate:
      type: object
      description: Used when requesting a new user consent for some purpose.
      properties:
        purpose:
          type: string
          description: Consent purpose (short code).
          example: application_processing
        description:
          type: string
          description: Description of why consent is needed.
          example: Allow processing for application review
      required:
        - purpose

    ApplicationStatus:
      type: string
      description: Status values for an application.
      enum:
        - draft # Saved but not submitted
        - documents_submitted # Documents uploaded
        - verification_pending # Awaiting verification
        - awaiting_payment # Waiting for user payment
        - payment_received # Payment completed
        - submitted # Application formally submitted
        - in_ballot # Entered into selection/ballot
        - selected # Chosen/approved via ballot
        - not_selected # Not chosen in ballot
        - under_review # In manual review process
        - approved # License approved
        - rejected # Application rejected
        - expired # Application expired (not continued)
        - cancelled # Withdrawn/cancelled by user

    PaymentStatus:
      type: string
      description: Status for any payment attempt.
      enum:
        - unpaid # Payment is pending
        - paid # Payment completed

    LicenseStatus:
      type: string
      description: Current license status.
      enum:
        - active # Valid and usable
        - suspended # Temporarily revoked
        - expired # No longer valid

    LicenseType:
      type: string
      description: License categories for holiday rentals.
      enum:
        - etv
        - etvpl
        - etv60

    ApplicationDocumentRecord:
      type: object
      description: Supporting documents attached to an application.
      properties:
        id:
          type: integer
          description: Unique document ID.
          example: 501
        application_id:
          type: integer
          description: Related application.
          example: 201
        document_type:
          type: string
          description: Type of uploaded document.
          example: energy_certificate
        filename:
          type: string
          description: Name of uploaded file.
          example: cert-energy.pdf
        uploaded_at:
          type: string
          format: date-time
          description: Upload date/time.
          example: 2025-05-21T11:30:00Z
        verification_status:
          type: string
          enum: [pending, verified, rejected]
          description: Verification status of the document.
          example: pending
        verified_at:
          type: ["null", string]
          format: date-time
          description: When this document was verified; null if not yet verified.
          example: null
        remarks:
          type: ["null", string]
          description: Review notes or comments.
          example: Page 2 missing
      required:
        - id
        - application_id
        - document_type
        - filename
        - uploaded_at
        - verification_status
