openapi: 3.1.0
info:
  title: Mallorca Holiday Rental Licensing API
  version: 1.0.0
  description: |
    API for managing applications, licenses, and payments for the Mallorca Holiday Rental Licensing system.
    Supports GDPR-compliant user management through Keycloak integration and ensures transparent, fair allocation of ETV licenses.

servers:
  - url: https://localhost:8080/

tags:
  - name: Authentication
    description: Endpoints for user authentication and token management via Keycloak.
  - name: Users
    description: Operations related to user management including account creation, updates, and authentication.
  - name: Applications
    description: Managing holiday rental license applications, including submission, updates, and retrieval.
  - name: Licenses
    description: Handling issued licenses for holiday rental properties, including retrieval and status management.
  - name: Document Verification
    description: Endpoints for uploading, verifying, and managing application supporting documents.
  - name: Payments
    description: Processing and tracking payments related to license applications and renewals.
  - name: Consent
    description: Managing user consents for data processing and compliance with regulatory requirements.
  - name: Ballot Periods
    description: Managing ballot periods for fair allocation of holiday rental licenses.

security:
  - KeycloakOAuth2:
      - openid
      - profile
      - email

paths:
  /login:
    post:
      tags: [Authentication]
      summary: User login
      description: Authenticate a user and obtain JWT access and refresh tokens.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Successful login
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResource"
        "401":
          description: Unauthorized - invalid credentials

  /register:
    post:
      tags: [Authentication]
      summary: User registration
      description: Register a new user account in the system.
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResource"
        "400":
          description: Bad request - invalid input data
        "409":
          description: Conflict - user already exists

  /refresh-login:
    post:
      tags: [Authentication]
      summary: Refresh JWT tokens
      description: Refresh the JWT access token using a valid refresh token.
      operationId: refreshLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: The refresh token issued during login.
                  example: dGhpcyBpcyBhIHJlZnJlc2ggdG9rZW4...
      responses:
        "200":
          description: Tokens refreshed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResource"
        "401":
          description: Unauthorized - invalid or expired refresh token

  /reset-password:
    post:
      tags: [Authentication]
      summary: Request password reset
      description: Initiate a password reset process for a user by email.
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset email sent
        "404":
          description: User with the given email not found

  /change-password:
    post:
      tags: [Authentication]
      summary: Change user password
      description: Change the password for an authenticated user.
      operationId: changeUserPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "201":
          description: Password changed successfully
        "400":
          description: Bad request - invalid input data

  /change-userdetails:
    post:
      tags: [ Authentication ]
      summary: Change user details
      description: Change the lastname or the email of a user
      operationId: changeUserDetails
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangeUserdetailsRequest"
      responses:
        "201":
          description: Details changed successfully
        "400":
          description: Bad request - invalid input data
        "409":
          description: Conflict - email already in use

  /users:
    get:
      tags: [Users]
      summary: List all users
      description: Retrieve a paginated list of users, optionally filtered by username or email, supporting search and pagination parameters.
      operationId: listUsers
      security:
        - KeycloakOAuth2: [openid]
      parameters:
        - name: username
          in: query
          schema:
            type: string
          description: Filter users by username.
          example: johndoe
        - name: email
          in: query
          schema:
            type: string
            format: email
          description: Filter users by email.
          example: johndoe@example.com
        - name: first
          in: query
          schema:
            type: integer
            minimum: 0
          description: Index of the first result to return (pagination offset).
          example: 0
        - name: max
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Maximum number of results to return.
          example: 20
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserResource"
        "400":
          description: Invalid query parameter
        "401":
          description: Unauthorized

    post:
      summary: Create a new user
      description: Create a new user account with the provided details.
      operationId: createUser
      tags: [Users]
      security:
        - KeycloakOAuth2: [openid]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                schema:
                  $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: User created successfully
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "409":
          description: User already exists

  /users/{userId}:
    get:
      tags: [Users]
      summary: Get user by ID
      description: Retrieve detailed information for a specific user by their unique identifier.
      operationId: getUser
      security:
        - KeycloakOAuth2: [openid]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResource"

    patch:
      summary: Update user attributes or password
      description: Update the attributes or password of a specific user.
      operationId: updateUser
      tags: [Users]
      security:
        - KeycloakOAuth2: [openid]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                  format: email
                enabled:
                  type: boolean
                credentials:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        enum: [password]
                      value:
                        type: string
                      temporary:
                        type: boolean
      responses:
        "204":
          description: User updated successfully
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "404":
          description: User not found

    delete:
      tags: [Users]
      summary: Delete a user by ID
      description: Remove a user from the system by their ID.
      operationId: deleteUser
      security:
        - KeycloakOAuth2: [openid]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "204":
          description: User deleted
        "404":
          description: User not found

  /users/{userId}/notifications:
    get:
      tags: [Users]
      summary: Return all notifications for a user.
      operationId: getNotifications
      security:
        - KeycloakOAuth2: [openid]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of notifications for a user.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserNotificationResource"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: User not found

  /users/notifications/{id}:
    patch:
      tags: [Users]
      summary: Update status of a notification.
      description: Update the read status of a specific notification for a user.
      operationId: updateNotification
      security:
        - KeycloakOAuth2: [openid]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Updated notification status.
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Notification not found

  /users/{userId}/notifications/preferences:
    get:
      tags: [Users]
      summary: Get notification preferences for a user
      description: Retrieve the notification preferences for a specific user.
      operationId: getNotificationPreferences
      security:
        - KeycloakOAuth2: [openid]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User notification preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferencesResource"
    patch:
      tags: [Users]
      summary: Update notification preferences for a user
      description: Update the notification preferences for a specific user.
      operationId: updateNotificationPreferences
      security:
        - KeycloakOAuth2: [openid]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferencesUpdate"
      responses:
        "200":
          description: Updated notification preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferencesResource"

  /applications:
    get:
      tags: [Applications]
      summary: List all applications or filter by status
      description: Retrieve all holiday rental license applications or filter them by status and user ID.
      operationId: listApplications
      security:
        - KeycloakOAuth2: [openid]
      parameters:
        - name: user_id
          in: query
          description: Filter licenses by user ID
          required: false
          schema:
            type: string
            format: uuid
        - name: application_status
          in: query
          description: Filter applications by status
          required: false
          schema:
            $ref: "#/components/schemas/ApplicationStatusApiEnum"
      responses:
        "200":
          description: List of applications (optionally filtered by status)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApplicationResource"
    post:
      tags: [Applications]
      summary: Create a new application
      description: Submit a new holiday rental license application.
      operationId: createApplication
      security:
        - KeycloakOAuth2: [openid]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationCreate"
      responses:
        "201":
          description: Application created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationResource"
        "409":
          description: No active ballot period
        "422":
          description: User does not exist

  /applications/{applicationId}:
    get:
      tags: [Applications]
      summary: Get application by ID
      description: Retrieve details of a specific application using its ID.
      operationId: getApplication
      security:
        - KeycloakOAuth2: [openid]
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Application details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationResource"
    patch:
      tags: [Applications]
      summary: Update application status or remarks
      description: Modify the status or remarks of an existing application.
      operationId: updateApplication
      security:
        - KeycloakOAuth2: [openid]
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationUpdate"
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationResource"

    delete:
      tags: [Applications]
      summary: Delete application by ID
      description: >
        Deletes the specified application. Note: Deleting an application that has an associated license
        will also result in deletion of the linked license.
      operationId: deleteApplication
      security:
        - KeycloakOAuth2: [openid]
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Application deleted successfully (and associated license if exists)
        "404":
          description: Application not found
        "403":
          description: Forbidden - insufficient permissions

  /validation-callback:
    post:
      tags: [Document Verification]
      summary: Endpoint for mock to send document validation results
      description: Endpoint for mock to send document validation results
      operationId: documentValidationCallback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - application_id
                - status
              properties:
                application_id:
                  type: integer
                  description: ID of the application being validated
                  example: 1
                status:
                  type: string
                  description: Validation result
                  enum:
                    - VERIFIED
                    - REJECTED
                rejection_reason:
                  type: string
                  nullable: true
                  description: Reason for rejection (only present if status = REJECTED)
      responses:
        default:
          description: No response expected

  /applications/{applicationId}/documents:
    get:
      tags: [Document Verification]
      summary: Get document validation status for an application
      description: Returns the validation result of the documents belonging to an application
      operationId: getApplicationDocuments
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: integer
          description: ID of the application
      responses:
        "200":
          description: Document validation result found
          content:
            application/json:
              schema:
                type: object
                required:
                  - application_id
                  - status
                properties:
                  application_id:
                    type: integer
                    description: ID of the application being validated
                    example: 1
                  status:
                    type: string
                    description: Validation result
                    enum:
                      - VERIFIED
                      - REJECTED
                  rejection_reason:
                    type: string
                    nullable: true
                    description: Reason for rejection (only present if status = REJECTED)
        "404":
          description: Application not found

  /applications/{applicationId}/payments:
    get:
      tags: [Payments]
      summary: List payments for an application
      description: Retrieve direct debit payment records associated with a specific application.
      operationId: listPayments
      security:
        - KeycloakOAuth2: [openid]
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Payments for the given application
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApplicationPaymentResource"
    post:
      tags: [Payments]
      summary: Record a new payment for an application
      description: Record a new direct debit payment related to a holiday rental license application.
      operationId: createPayment
      security:
        - KeycloakOAuth2: [openid]
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationPaymentCreate"
      responses:
        "201":
          description: Payment recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationPaymentResource"

  /fees/{applicationId}:
    get:
      tags: [Payments]
      summary: Get application fee amount
      description: Retrieve the fee amount for a specific holiday rental license application.
      operationId: getApplicationFee
      security:
        - KeycloakOAuth2: [openid]
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Application fee amount
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationFeeResource"
        "404":
          description: Application not found

  /ballot-periods:
    get:
      tags: [Ballot Periods]
      summary: List all ballot periods
      description: Retrieve a list of all ballot periods, including their start and end dates.
      operationId: listBallotPeriods
      responses:
        "200":
          description: List of ballot periods
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BallotPeriodResource"
        "401":
          description: Unauthorized
    post:
      tags: [Ballot Periods]
      summary: Create a ballot period
      description: Create a new ballot period by defining its start and end dates.
      operationId: createBallotPeriod
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                start_date:
                  type: string
                  format: date-time
                end_date:
                  type: string
                  format: date-time
      responses:
        "201":
          description: Ballot period created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BallotPeriodResource"
        "409":
          description: Conflict - overlapping ballot periods are not allowed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error_code:
                    type: string
                    example: "OVERLAPPING_PERIOD"
                  message:
                    type: string
                    example: "The specified start and end dates overlap with an existing ballot period."

  /ballot-periods/current:
    get:
      tags: [Ballot Periods]
      summary: Get date of most current
      description: >
        Retrieve the start and end dates of the current,
        next (if none ongoing) or last ballot period (if none ongoing or upcoming).
      operationId: getBallotPeriod
      responses:
        "200":
          description: Current, upcoming or last ballot period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentBallotPeriodResource"
        "204":
          description: No active ballot periods found

  /ballot-periods/{period_id}:
    get:
      tags: [Ballot Periods]
      summary: Retrieve ballot period details
      description: >
        Retrieves the details and configuration for a specific ballot period, 
        including its start and end dates and other metadata.
      operationId: getBallotPeriodDetails
      parameters:
        - in: path
          name: period_id
          required: true
          schema:
            type: integer
          description: Unique identifier for the ballot period
      responses:
        "200":
          description: Ballot period details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BallotPeriodResource"

  /ballot-periods/{period_id}/entries:
    get:
      tags: [Ballot Periods]
      summary: List entries for a ballot period
      description: List all submitted applications/entries for a specific ballot period.
      operationId: getBallotPeriodEntries
      parameters:
        - in: path
          name: period_id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of entries for the period
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApplicationResource"

  /ballot-periods/{period_id}/lottery:
    post:
      tags: [Ballot Periods]
      summary: Run the lottery round for a ballot period
      description: >
        Triggers the allocation (lottery) process for this ballot period,
        assigning selected status as true/false to eligible applications within the given period.
        It is important to note, that a period has to be over.
      operationId: runLotteryForBallotPeriod
      parameters:
        - in: path
          name: period_id
          required: true
          schema:
            type: integer
        - name: licensesCount
          description: Number of licenses to allocate in this lottery round
          in: query
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                license_type:
                  $ref: "#/components/schemas/LicenseTypeApiEnum"
      responses:
        "200":
          description: Lottery results with updated statuses for applications in the period
          content:
            application/json:
              schema:
                type: object
                properties:
                  selected_applications:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApplicationResource"
                  not_selected_applications:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApplicationResource"
        "400":
          description: Bad request - invalid input data. Can be caused because period is not over yet

  /licenses:
    get:
      tags: [Licenses]
      summary: List all licenses or filter by user ID
      description: List all licenses or filter licenses by user ID.
      operationId: listLicenses
      security:
        - KeycloakOAuth2: [openid]
      parameters:
        - name: user_id
          in: query
          description: Filter licenses by user ID
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of licenses (optionally filtered by user ID)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LicenseResource"

  /licenses/{licenseId}:
    get:
      tags: [Licenses]
      summary: Get license by ID
      description: Get detailed information for a specific license.
      operationId: getLicense
      security:
        - KeycloakOAuth2: [openid]
      parameters:
        - name: licenseId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: License details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseResource"
    patch:
      tags: [Licenses]
      summary: Update the status of a license
      description: Update the status of a license.
      operationId: updateLicenseStatus
      security:
        - KeycloakOAuth2: [openid]
      parameters:
        - name: licenseId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                license_status:
                  $ref: "#/components/schemas/LicenseStatusApiEnum"
              required:
                - license_status
      responses:
        "200":
          description: License status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseResource"

    delete:
      tags: [Licenses]
      summary: Delete license by ID
      description: Delete a license record by its ID.
      operationId: deleteLicense
      security:
        - KeycloakOAuth2: [openid]
      parameters:
        - name: licenseId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: License deleted successfully
        "404":
          description: License not found
        "403":
          description: Forbidden - insufficient permissions

  /consents:
    get:
      tags: [Consent]
      summary: List consents for current user
      description: Retrieve all consents given by the current user.
      operationId: listConsentsForUser
      security:
        - KeycloakOAuth2: [openid]
      responses:
        "200":
          description: Consents for user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConsentResource"

    post:
      tags: [Consent]
      summary: Give consent for a processing purpose
      description: Grant a new consent for a specific data processing purpose.
      operationId: createConsentForUser
      security:
        - KeycloakOAuth2: [openid]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentCreate"
      responses:
        "201":
          description: Consent granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsentResource"

  /consents/{consentId}:
    delete:
      tags: [Consent]
      summary: Withdraw consent
      description: Withdraw a previously granted consent.
      operationId: deleteConsentForUser
      security:
        - KeycloakOAuth2: [openid]
      parameters:
        - name: consentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Consent withdrawn

  /consents/check:
    post:
      tags: [Consent]
      summary: Check if user has valid consent for purpose
      description: Check whether the user has valid consent for a given purpose.
      operationId: checkConsentForUser
      security:
        - KeycloakOAuth2: [openid]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                purpose:
                  type: string
                  example: "application_processing"
      responses:
        "200":
          description: Consent check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  hasConsent:
                    type: boolean

  /consents/gdpr-deletion:
    post:
      tags: [Consent]
      summary: Request deletion of all personal data under GDPR
      description: >
        Initiates a GDPR data deletion process to erase all personal data related to the user,
        including consents, applications, licenses, and other stored information. This request
        is irreversible and subject to the portal's compliance process.
      operationId: requestGdprDeletion
      security:
        - KeycloakOAuth2: [openid]
      parameters:
        - name: userId
          in: path
          description: Unique identifier of the user whose data should be deleted
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Deletion request accepted and processing started
        "400":
          description: Invalid request
        "401":
          description: Unauthorized

components:
  securitySchemes:
    KeycloakOAuth2:
      type: oauth2
      description: OAuth2 with Keycloak JWT Bearer tokens.
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:8080/auth/realms/license-realm/protocol/openid-connect/auth
          tokenUrl: http://localhost:8080/auth/realms/license-realm/protocol/openid-connect/token
          scopes:
            openid: OpenID Connect scope
            profile: Profile information access
            email: Email access

  schemas:
    LoginRequest:
      type: object
      description: Request payload for user login.
      properties:
        email:
          type: string
          format: email
          description: User's username.
          example: johndoe@email.com
        password:
          type: string
          format: password
          description: User's password.
          example: securepassword123
      required:
        - username
        - password
    LoginResource:
      type: object
      description: Response payload containing authentication tokens.
      properties:
        access_token:
          type: string
          description: JWT access token for authenticated requests.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..
          x-field-extra-annotation: '@JsonProperty("access_token")'
        refresh_token:
          type: string
          description: Token used to obtain a new access token.
          example: dGhpcyBpcyBhIHJlZnJlc2ggdG9rZW4...
          x-field-extra-annotation: '@JsonProperty("refresh_token")'
        expires_in:
          type: integer
          description: Time in seconds until the access token expires.
          example: 3600
          x-field-extra-annotation: '@JsonProperty("expires_in")'
        refresh_expires_in:
          type: integer
          description: Time in seconds until the refresh token expires.
          example: 86400
          x-field-extra-annotation: '@JsonProperty("refresh_expires_in")'
        token_type:
          type: string
          description: Type of the token issued.
          example: Bearer
          x-field-extra-annotation: '@JsonProperty("token_type")'
        is_admin:
          type: boolean
          description: Indicates if the user has administrative privileges.
          example: false
      required:
        - access_token
        - refresh_token
        - expires_in
        - token_type
    RegisterRequest:
      type: object
      description: Request payload for user registration.
      properties:
        firstname:
          type: string
          description: User's first name.
          example: John
        lastname:
          type: string
          description: User's last name.
          example: Doe
        email:
          type: string
          format: email
          description: User's email address.
          example: johndoe@email.com
        password:
          type: string
          format: password
          description: User's desired password.
          example: securepassword123

    RegisterResource:
      type: object
      description: Response payload after successful user registration.
      properties:
        user_id:
          type: string
          format: uuid
          description: Unique identifier of the newly created user.
          example: f28d1d3b-9bcb-4a74-a65a-2fede2b0a6c3
        message:
          type: string
          description: Confirmation message.
          example: User registered successfully. Please verify your email to activate the account.

    ChangeUserdetailsRequest:
      type: object
      description: Request payload for user details change.
      additionalProperties: false
      minProperties: 2
      properties:
        userId:
          type: string
          format: uuid
          description: User's unique identifier.
          example: f28d1d3b-9bcb-4a74-a65a-2fede2b0a6c3
        firstname:
          type: string
          description: User's new first name.
          example: John
        lastname:
          type: string
          description: User's new last name.
          example: Doe
        email:
          type: string
          format: email
          description: User's new email address.
          example: johndoe@email.com
      required:
        - userId

    ResetPasswordRequest:
      type: object
      description: Request payload for initiating a password reset.
      properties:
        email:
          type: string
          format: email
          description: Email address associated with the user account.
          example: john.doe@example.com

    ChangePasswordRequest:
      type: object
      description: Request payload for changing the user's password.
      properties:
        token:
          type: string
          format: bytes
          description: User's token.
          example: dmFoYW4uZHVjaGVyQGljbG91ZC5jb206MTc2Nzk1ODU1OTE4MQ==
        new_password:
          type: string
          format: password
          description: User's new desired password.
          example: newsecurepassword456

    UserResource:
      type: object
      description: Represents a user of the holiday rental licensing portal, typically sourced from a Keycloak identity provider.
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the user.
          example: f28d1d3b-9bcb-4a74-a65a-2fede2b0a6c3
        username:
          type: string
          description: Unique username for login.
          example: johndoe
        email:
          type: string
          format: email
          description: User's email address.
          example: johndoe@example.com
        firstName:
          type: string
          description: User's first name.
          example: John
        lastName:
          type: string
          description: User's last name.
          example: Doe
        enabled:
          type: boolean
          description: Indicates if account is active.
          example: true
        emailVerified:
          type: boolean
          description: Whether the email has been verified.
          example: true
        createdTimestamp:
          type: integer
          format: int64
          description: Time the user was created (milliseconds since epoch).
          example: 1699458000000
      required:
        - username
        - enabled

    UserCreate:
      type: object
      description: Request payload for creating a new user in Keycloak.
      properties:
        username:
          type: string
          description: Unique username for login.
          example: johndoe
        email:
          type: string
          format: email
          description: User's email address.
          example: johndoe@example.com
        firstName:
          type: string
          description: User's first name.
          example: John
        lastName:
          type: string
          description: User's last name.
          example: Doe
        enabled:
          type: boolean
          description: Indicates if account is active.
          default: true
          example: true
        credentials:
          type: array
          description: List of user credentials.
          items:
            type: object
            properties:
              type:
                type: string
                enum: [password]
                description: Credential type.
                example: password
              temporary:
                type: boolean
                description: Whether this password is temporary.
                default: false
                example: false
              value:
                type: string
                description: Password value (hashed or direct depending on Keycloak configuration).
      required:
        - username
        - enabled

    UserNotificationResource:
      type: object
      description: A notification for a user
      properties:
        id:
          type: string
          format: uuid
          description: Unique message identifier.
          example: f28d1d3b-9bcb-4a74-a65a-2fede2b0a6c3
        application_id:
          type: integer
          description: Unique application identifier.
          example: 201
        user_id:
          type: string
          format: uuid
          description: ID of the applicant user.
          example: f28d1d3b-9bcb-4a74-a65a-2fede2b0a6c3
        date:
          type: string
          format: date-time
          description: Event time of the notification.
          example: 2025-05-20T08:00:00Z
        message:
          type: string
          description: The message of the notification.
          example: "Your application has been approved."
        is_read:
          type: boolean
          description: Status if the message has been read by the user.
      required:
        - id
        - user_id
        - date
        - message
        - read

    LicenseResource:
      type: object
      description: Represents a holiday rental license issued to a user for a property.
      properties:
        id:
          type: integer
          description: Unique license identifier.
          example: 101
        user_id:
          type: string
          format: uuid
          description: User identifier who owns the license.
          example: f28d1d3b-9bcb-4a74-a65a-2fede2b0a6c3
        application_id:
          type: integer
          description: ID of the related application.
          example: 201
        license_type:
          $ref: "#/components/schemas/LicenseTypeApiEnum"
        license_status:
          $ref: "#/components/schemas/LicenseStatusApiEnum"
        issued_at:
          type: string
          format: date-time
          description: Issue date/time of the license.
          example: 2025-07-01T10:00:00Z
        expires_at:
          type: string
          format: date-time
          description: Expiry date/time of the license.
          example: 2028-07-01T10:00:00Z
        cadastral_reference:
          type: string
          minLength: 20
          maxLength: 20
          description: Unique cadastral code (property reference).
          example: 1234567AB9999C0001DE
      required:
        - id
        - user_id
        - application_id
        - license_type
        - license_status

    ApplicationResource:
      type: object
      description: Represents a user's request for a holiday rental license.
      properties:
        id:
          type: integer
          description: Unique application identifier.
          example: 201
        user_id:
          type: string
          format: uuid
          description: ID of the applicant user.
          example: f28d1d3b-9bcb-4a74-a65a-2fede2b0a6c3
        license_type:
          $ref: "#/components/schemas/LicenseTypeApiEnum"
        cadastral_reference:
          type: string
          minLength: 20
          maxLength: 20
          description: Unique cadastral code (property reference).
          example: 1234567AB9999C0001DE
        applied_at:
          type: string
          format: date-time
          description: When the application was submitted.
          example: 2025-05-20T08:00:00Z
        changed_at:
          type: string
          format: date-time
          description: When the application was last updated.
          example: 2025-06-01T10:00:00Z
        application_status:
          $ref: "#/components/schemas/ApplicationStatusApiEnum"
        remarks:
          type: string
          description: Additional information or comments.
          example: Needs urgent review.
      required:
        - id
        - user_id
        - license_type
        - cadastral_reference
        - application_status

    ApplicationCreate:
      type: object
      description: Payload for creating a new application for a rental license.
      properties:
        user_id:
          type: string
          format: uuid
          description: User who submits the application.
          example: f28d1d3b-9bcb-4a74-a65a-2fede2b0a6c3
        license_type:
          $ref: "#/components/schemas/LicenseTypeApiEnum"
        cadastral_reference:
          type: string
          minLength: 20
          maxLength: 20
          description: Property cadastral reference.
          example: 1234567AB9999C0001DE
        remarks:
          type: string
          description: Additional notes.
          example: First time applying
      required:
        - user_id
        - license_type
        - cadastral_reference

    ApplicationUpdate:
      type: object
      description: Used to update the application status or add remarks.
      properties:
        application_status:
          $ref: "#/components/schemas/ApplicationStatusApiEnum"
        remarks:
          type: string
          description: Additional notes or comments.
          example: Missing one document
        cadastral_reference:
          type: string
          description: Cadastral/reference number for the property.
          example: "12345678901234567890"
        license_type:
          $ref: "#/components/schemas/LicenseTypeApiEnum"

    ApplicationPaymentResource:
      type: object
      description: Represents a payment made for an application.
      properties:
        id:
          type: integer
          description: Unique identifier for the payment.
          example: 401
        application_id:
          type: integer
          description: Associated application ID.
          example: 201
        amount:
          type: number
          format: decimal
          description: Payment amount in EUR.
          example: 123.45
        name:
          type: string
          description: Account holder's name.
          example: John Doe
        iban:
          type: string
          description: IBAN of the payment method.
          example: DE01234567890123456789
        bic:
          type: string
          description: BIC/SWIFT code of the bank.
          example: DEUTDEAAXXX
        payment_date:
          type: string
          format: date-time
          description: When payment was made.
          example: 2025-05-22T15:10:00Z
        payment_status:
          $ref: "#/components/schemas/PaymentStatusApiEnum"
      required:
        - id
        - application_id
        - amount
        - name
        - iban
        - payment_status

    ApplicationPaymentCreate:
      type: object
      description: Payload for creating a new payment for an application.
      properties:
        application_id:
          type: integer
          description: Associated application ID.
          example: 201
        name:
          type: string
          description: Account holder's name.
          example: John Doe
        iban:
          type: string
          description: IBAN of the payment method.
          example: DE01234567890123456789
        bic:
          type: string
          description: BIC/SWIFT code of the bank.
          example: DEUTDEAAXXX
      required:
        - application_id
        - name
        - iban

    ApplicationFeeResource:
      type: object
      description: Represents the fee amount for an application.
      properties:
        application_id:
          type: integer
          description: Associated application ID.
          example: 201
        fee_amount:
          type: number
          format: decimal
          description: Fee amount in EUR.
          example: 150.00
      required:
        - application_id
        - fee_amount

    ConsentResource:
      type: object
      description: Tracks user consent for various data processing purposes.
      properties:
        id:
          type: string
          description: Unique consent record ID.
          example: cr01
        user_id:
          type: string
          description: User who gave (or withdrew) the consent.
          example: f28d1d3b-9bcb-4a74-a65a-2fede2b0a6c3
        purpose:
          type: string
          description: Purpose of the consent (e.g. application processing, marketing).
          example: application_processing
        granted:
          type: boolean
          description: True if consent is currently granted.
          example: true
        granted_at:
          type: string
          format: date-time
          description: When consent was granted.
          example: 2025-05-10T13:00:00Z
        withdrawn_at:
          type: ["null", string]
          format: date-time
          description: When consent was withdrawn, or null if not withdrawn.
          example: null
      required:
        - id
        - user_id
        - purpose
        - granted
        - granted_at

    ConsentCreate:
      type: object
      description: Used when requesting a new user consent for some purpose.
      properties:
        purpose:
          type: string
          description: Consent purpose (short code).
          example: application_processing
        description:
          type: string
          description: Description of why consent is needed.
          example: Allow processing for application review
      required:
        - purpose

    ApplicationStatusApiEnum:
      type: string
      description: Status values for an application.
      enum:
        - DRAFT # Saved but not submitted
        - DOCUMENTS_SUBMITTED # Documents uploaded
        - VERIFICATION_PENDING # Awaiting verification
        - AWAITING_PAYMENT # Waiting for user payment
        - PAYMENT_RECEIVED # Payment details received
        - SUBMITTED # Application formally submitted
        - IN_BALLOT # Entered into selection/ballot
        - SELECTED # Chosen/approved via ballot
        - NOT_SELECTED # Not chosen in ballot
        - UNDER_REVIEW # In manual review process
        - APPROVED # License approved
        - REJECTED # Application rejected or payment denied
        - EXPIRED # Application expired (not continued)
        - CANCELLED # Withdrawn/cancelled by user

    PaymentStatusApiEnum:
      type: string
      description: Status for any payment attempt.
      enum:
        - UNPAID # Payment is pending
        - PAID # Payment completed

    LicenseStatusApiEnum:
      type: string
      description: Current license status.
      enum:
        - ACTIVE # Valid and usable
        - SUSPENDED # Temporarily revoked
        - EXPIRED # No longer valid

    LicenseTypeApiEnum:
      type: string
      description: License categories for holiday rentals.
      enum:
        - ETV
        - ETVPL
        - ETV60

    ApplicationDocumentResource:
      type: object
      description: Supporting documents attached to an application.
      properties:
        id:
          type: integer
          description: Unique document ID.
          example: 501
        application_id:
          type: integer
          description: Related application.
          example: 201
        document_type:
          type: string
          description: Type of uploaded document.
          example: energy_certificate
        filename:
          type: string
          description: Name of uploaded file.
          example: cert-energy.pdf
        uploaded_at:
          type: string
          format: date-time
          description: Upload date/time.
          example: 2025-05-21T11:30:00Z
        verification_status:
          type: string
          enum: [pending, verified, rejected]
          description: Verification status of the document.
          example: pending
        verified_at:
          type: ["null", string]
          format: date-time
          description: When this document was verified; null if not yet verified.
          example: null
        remarks:
          type: ["null", string]
          description: Review notes or comments.
          example: Page 2 missing
      required:
        - id
        - application_id
        - document_type
        - filename
        - uploaded_at
        - verification_status

    BallotPeriodResource:
      type: object
      properties:
        ballot_period_id:
          type: integer
          description: Unique identifier for the ballot period
        start_date:
          type: string
          format: date-time
          description: Ballot period start, ISO 8601 format
        end_date:
          type: string
          format: date-time
          description: Ballot period end, ISO 8601 format
        totalApplications:
          type: integer
          description: Total number of applications received in this ballot period

    CurrentBallotPeriodResource:
      type: object
      properties:
        start_date:
          type: string
          format: date-time
          description: Ballot period start, ISO 8601 format
        end_date:
          type: string
          format: date-time
          description: Ballot period end, ISO 8601 format

    NotificationPreferencesResource:
      type: object
      description: User notification preferences for the holiday rental licensing portal.
      properties:
        id:
          type: integer
          description: Unique identifier of the notification preferences record.
          example: 301
        user_id:
          type: string
          format: uuid
          description: Unique identifier of the user.
          example: f28d1d3b-9bcb-4a74-a65a-2fede2b0a6c3
        notification_way:
          $ref: "#/components/schemas/NotificationWayApiEnum"
        application_updates_notification:
          type: boolean
          description: Whether to receive notifications about application updates.
          example: true
        license_renewal_notification:
          type: boolean
          description: Whether to receive notifications about license renewals.
          example: false
      required:
        - id
        - user_id
        - notification_way
        - application_updates_notification
        - license_renewal_notification

    NotificationPreferencesUpdate:
      type: object
      description: Payload for updating user notification preferences.
      properties:
        notification_way:
          $ref: "#/components/schemas/NotificationWayApiEnum"
        application_updates_notification:
          type: boolean
          description: Whether to receive notifications about application updates.
          example: true
        license_renewal_notification:
          type: boolean
          description: Whether to receive notifications about license renewals.
          example: false

    NotificationWayApiEnum:
      type: string
      description: Methods of notification delivery.
      enum:
        - EMAIL # Notifications via email
        - SMS # Notifications via SMS
        - NONE # No notifications

