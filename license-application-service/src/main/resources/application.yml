spring:
  application:
    name: licensing

  liquibase:
    change-log: db/master-changelog.xml
    default-schema: licensing
    liquibase-schema: public
    enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI}

  jooq:
    sql-dialect: postgres

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    debug: false
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.ssl.trust: ${MAIL_HOST:smtp.gmail.com}

  config:
    import:
      - optional:file:license-application-service/.env    # local
      - optional:file:/app/.env                           # docker

logging:
  level:
    org.jooq.Constants: off

springdoc:
  swagger-ui:
    operations-sorter: alpha
    oauth:
      client-id: ${KEYCLOAK_CLIENT_ID:backend-api}
      client-secret: ${KEYCLOAK_CLIENT_SECRET}
      use-pkce-with-authorization-code-grant: true
    oauth2-redirect-url: ${SWAGGER_REDIRECT_URL:http://localhost:8080/swagger-ui/oauth2-redirect.html}

error:
  handling:
    http-status-in-json-response: true
    exception-logging: NO_LOGGING
    full-stacktrace-http-statuses: 5xx
    log-levels:
      5xx: ERROR

keycloak:
  url: ${KEYCLOAK_URL}
  realm: ${KEYCLOAK_REALM:license-realm}
  client-id: ${KEYCLOAK_CLIENT_ID:backend-api}
  client-secret: ${KEYCLOAK_CLIENT_SECRET}

mockbank:
  base-url: ${MOCKBANK_BASE_URL}