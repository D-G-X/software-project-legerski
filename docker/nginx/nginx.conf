events {}

http {

  # ---- CORS origin whitelist (localhost) ----
  map $http_origin $cors_origin {
    default "";
    "~^https?://localhost(:[0-9]+)?$" $http_origin;
  }

  upstream backend_upstream {
    least_conn;
    server license-application-backend:8080;
  }

  upstream document_validator {
    server mock-document-validator:8080;
  }

  upstream keycloak {
    server keycloak:8080;
  }

  server {
    listen 80;

    # -------------------------------
    # Global CORS headers
    # -------------------------------
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

    # -------------------------------
    # Preflight handling
    # -------------------------------
    location = /_preflight {
      return 204;
    }

    # -------------------------------
    # Backend API (load balancer)
    # -------------------------------
    location / {
      # OPTIONS never reach backend
      error_page 418 = @_cors_preflight;
      if ($request_method = OPTIONS) { return 418; }

      proxy_pass http://backend_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @_cors_preflight {
      return 204;
    }

    # -------------------------------
    # Mock document validator
    # -------------------------------
    location /process-document {

      # ✅ Allow uploads up to 10 MB
      client_max_body_size 10m;

      error_page 418 = @_cors_preflight;
      if ($request_method = OPTIONS) { return 418; }

      proxy_pass http://document_validator/process-document;
      proxy_set_header Host $host;
    }

    # -------------------------------
    # Keycloak
    # -------------------------------
    location /auth/ {
      error_page 418 = @_cors_preflight;
      if ($request_method = OPTIONS) { return 418; }

      proxy_pass http://keycloak;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}