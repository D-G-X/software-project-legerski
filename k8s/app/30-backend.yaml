apiVersion: v1
kind: Service
metadata:
  name: license-application-backend
  namespace: license-app
spec:
  selector:
    app: license-application-backend
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: license-application-backend
  namespace: license-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: license-application-backend
  template:
    metadata:
      labels:
        app: license-application-backend
    spec:
      containers:
        - name: backend
          image: license-application-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: license-config
            - secretRef:
                name: license-secrets
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: 1500m
              memory: 1024Mi