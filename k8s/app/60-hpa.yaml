apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: license-application-backend-hpa
  namespace: license-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: license-application-backend
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75