apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - 00-namespace.yaml
  - 10-postgres.yaml
  - 20-keycloak.yaml

configMapGenerator:
  - name: keycloak-realm
    files:
      - ./realm-export.json
  - name: license-config
    envs:
      - ./.env

generatorOptions:
  disableNameSuffixHash: true

namespace: license-app