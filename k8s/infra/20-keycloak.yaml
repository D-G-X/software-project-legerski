apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: license-app
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: license-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0.0
          args: ["start-dev", "--import-realm", "--features=scripts"]
          ports:
            - containerPort: 8080
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                configMapKeyRef:
                  name: license-config
                  key: KEYCLOAK_ADMIN
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: license-config
                  key: KEYCLOAK_ADMIN_PASSWORD

            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL
              value: "jdbc:postgresql://postgres:5432/government"
            - name: KC_DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: license-config
                  key: POSTGRES_USER
            - name: KC_DB_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: license-config
                  key: POSTGRES_PASSWORD

            - name: KC_FEATURES
              value: "scripts"
            - name: KC_SCRIPTS_UPLOAD_ENABLED
              value: "true"
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import/realm-export.json
              subPath: realm-export.json
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm